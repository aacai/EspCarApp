version: "1.0"

stages:
  - build

jobs:
  # ----------------------------------------------------------------
  # 通用构建任务模板：检出 + JDK 21 + Gradle 缓存 + 指定 Gradle 任务
  # ----------------------------------------------------------------
  android:
    stage: build
    image: cnbcool/stack:java-21
    cache:
      key: gradle-${CI_COMMIT_REF_SLUG}
      paths:
        - ~/.gradle/caches
        - ~/.gradle/wrapper
    script:
      - chmod +x gradlew
      - yes | sdkmanager --licenses || true
      - ./gradlew :androidApp:assembleRelease --stacktrace
    artifacts:
      name: android
      paths:
        - androidApp/build/outputs/apk/release/*.apk

  desktop-linux:
    stage: build
    image: cnbcool/stack:java-21
    cache:
      key: gradle-${CI_COMMIT_REF_SLUG}
      paths:
        - ~/.gradle/caches
        - ~/.gradle/wrapper
    script:
      - chmod +x gradlew
      - apt-get update && apt-get install -y fakeroot dpkg || true
      - ./gradlew :desktopApp:packageDeb --stacktrace
    artifacts:
      name: desktop-linux
      paths:
        - desktopApp/build/compose/binaries/main/deb/*.deb

  desktop-windows:
    stage: build
    image: cnbcool/stack:java-21
    cache:
      key: gradle-${CI_COMMIT_REF_SLUG}
      paths:
        - ~/.gradle/caches
        - ~/.gradle/wrapper
    script:
      - chmod +x gradlew
      - ./gradlew :desktopApp:packageMsi :desktopApp:packageExe --stacktrace
    artifacts:
      name: desktop-windows
      paths:
        - desktopApp/build/compose/binaries/main/msi/*.msi
        - desktopApp/build/compose/binaries/main/exe/*.exe

  web:
    stage: build
    image: cnbcool/stack:java-21
    cache:
      key: gradle-${CI_COMMIT_REF_SLUG}
      paths:
        - ~/.gradle/caches
        - ~/.gradle/wrapper
    script:
      - chmod +x gradlew
      - ./gradlew :webApp:wasmJsBrowserDistribution --stacktrace
    artifacts:
      name: web
      paths:
        - webApp/build/dist/wasmJs/productionExecutable
